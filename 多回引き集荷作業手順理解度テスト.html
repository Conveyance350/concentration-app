<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5cab" />
  <title>多回引き集荷 作業手順理解度テスト</title>
  <style>
:root{--blue:#0b5cab;--blue2:#08467f;--light:#eaf4ff;--green:#18864b;--red:#c93535;--ink:#17202b;--muted:#687485;--line:#dbe3ec;--bg:#f4f7fa;--white:#fff;--shadow:0 12px 28px rgba(22,45,75,.10)}
*{box-sizing:border-box}
body{margin:0;font-family:"Meiryo UI",Meiryo,"Yu Gothic UI","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.topbar{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:22px max(18px,calc((100vw - 760px)/2));display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px rgba(0,45,95,.22)}
h1{font-size:clamp(22px,4vw,32px);line-height:1.25;margin:2px 0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0;opacity:.78}
.subtitle{margin:4px 0 0;opacity:.85;font-size:14px}
.container{width:min(100%,760px);margin:0 auto;padding:24px 16px 46px}
.screen{display:none}.screen.active{display:block}
.hero-card,.form-card,.question-card,.result-card,.history-list,.review-item{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.hero-card{padding:26px;text-align:center;margin-bottom:18px}
.hero-card h2{margin:10px 0 8px}
.hero-card p{color:var(--muted);line-height:1.7}
.hero-icon{width:68px;height:68px;border-radius:50%;background:var(--light);color:var(--blue);display:grid;place-items:center;margin:auto;font-size:38px;font-weight:800}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.info-grid div{background:#f7f9fc;border-radius:14px;padding:12px 6px}
.info-grid strong{display:block;color:var(--blue);font-size:23px}
.info-grid span{font-size:11px;color:var(--muted)}
.form-card{padding:22px}
.form-card label:not(.check-row){display:block;font-weight:700;margin-bottom:16px}
.form-card input[type=text]{width:100%;margin-top:7px;border:1.5px solid #cbd6e2;border-radius:12px;padding:14px;font-size:16px;outline:none}
.form-card input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,171,.12)}
.check-row{display:flex;gap:10px;align-items:center;margin:6px 0 18px;color:var(--muted)}
.form-error{color:var(--red);font-weight:700;font-size:14px;margin:0 0 12px}
.source-label{font-weight:700;margin:4px 0 12px}
.csv-message{font-size:13px;line-height:1.6;margin:12px 0 0;padding:12px;border-radius:10px;background:#f7f9fc;color:var(--muted);white-space:pre-wrap}
.csv-message.ng{background:#fff0f0;color:#a52929;font-weight:700}
.csv-message.ok{background:#eaf8f0;color:#126c3c;font-weight:700}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #2c95e8;outline-offset:2px}
.primary-btn,.secondary-btn{width:100%;border-radius:13px;padding:15px 16px;font-weight:800;font-size:16px}
.primary-btn{border:0;background:var(--blue);color:#fff;box-shadow:0 7px 15px rgba(11,92,171,.22)}
.primary-btn:hover{background:var(--blue2)}
.secondary-btn{background:#fff;color:var(--blue);border:1.5px solid var(--blue);margin-top:11px}
.text-btn,.danger-text{width:100%;border:0;background:transparent;padding:13px;color:var(--muted)}
.danger-text{color:var(--red)}
.icon-btn{border:1px solid rgba(255,255,255,.45);color:#fff;background:rgba(255,255,255,.12);width:42px;height:42px;border-radius:12px;font-size:24px}
.progress-wrap{margin-bottom:16px}
.progress-meta{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:8px}
.progress-track{height:10px;background:#dce5ef;border-radius:99px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#0b5cab,#2c95e8);transition:width .3s}
.question-card{padding:24px}
.step-badge{display:inline-block;background:var(--light);color:var(--blue);font-weight:800;border-radius:99px;padding:7px 12px}
.question-no{color:var(--muted);font-size:13px;font-weight:700;margin:20px 0 6px}
.question-card h2{font-size:clamp(21px,4vw,28px);line-height:1.5;margin:0}
.context{color:var(--muted);line-height:1.65;margin-bottom:20px}
.choices{display:grid;gap:11px}
.choice{width:100%;text-align:left;border:1.5px solid #ced8e3;background:#fff;border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;font-weight:700;transition:.15s}
.choice:hover{border-color:var(--blue);background:#f7fbff}
.choice-letter{flex:0 0 30px;height:30px;border-radius:50%;background:#eef3f8;display:grid;place-items:center;color:var(--blue)}
.choice.correct{border-color:var(--green);background:#edf9f2}
.choice.wrong{border-color:var(--red);background:#fff0f0}
.choice:disabled{cursor:default;color:var(--ink)}
.feedback{margin:18px 0 13px;border-radius:12px;padding:14px;font-weight:700;line-height:1.5}
.feedback.ok{background:#eaf8f0;color:#126c3c}
.feedback.ng{background:#fff0f0;color:#a52929}
.result-card{text-align:center;padding:28px}
.result-mark{display:inline-block;font-weight:900;border-radius:99px;padding:8px 18px;margin:15px}
.result-mark.pass{background:#eaf8f0;color:var(--green)}
.result-mark.fail{background:#fff0f0;color:var(--red)}
.score-circle{width:150px;height:150px;border-radius:50%;border:12px solid var(--light);display:flex;align-items:baseline;justify-content:center;padding-top:42px;margin:0 auto 16px;color:var(--blue)}
.score-circle strong{font-size:48px}
.score-circle span{font-weight:800}
.result-card p{color:var(--muted);line-height:1.6}
.review-list{display:grid;gap:12px;margin:18px 0}
.review-item{padding:17px}
.review-item h3{font-size:15px;margin:0 0 8px}
.review-item p{margin:4px 0;color:var(--muted);font-size:14px}
.review-item .answer{color:var(--green);font-weight:800}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.section-heading h2{margin:4px 0}
.small-btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:10px;padding:9px 12px;font-weight:800}
.history-list{overflow:hidden}
.history-row{padding:15px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:5px}
.history-row:last-child{border-bottom:0}
.history-row strong{font-size:16px}
.history-row span{color:var(--muted);font-size:13px}
.history-score{grid-row:1/3;grid-column:2;align-self:center;font-size:22px;font-weight:900;color:var(--blue)}
.empty{padding:30px;text-align:center;color:var(--muted)}
footer{text-align:center;padding:0 16px 28px;color:#8a95a3;font-size:12px}
.hidden{display:none!important}
.mobile-only{display:none}
@media(max-width:520px){.mobile-only{display:block}.topbar{padding:18px}.container{padding-top:18px}.question-card{padding:20px}.info-grid strong{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">物流教育アプリ</p>
      <h1>多回引き集荷<br class="mobile-only">作業手順理解度テスト</h1>
      <p class="subtitle">HT照合・荷山形成なし</p>
    </div>
    <button id="homeBtn" class="icon-btn hidden" aria-label="トップへ戻る">⌂</button>
  </header>

  <main id="app" class="container">
    <section id="startScreen" class="screen active">
      <div class="hero-card">
        <div class="hero-icon">✓</div>
        <h2>作業手順を確認しよう</h2>
        <p id="heroLead"></p>
        <div class="info-grid">
          <div><strong id="infoTotal">0</strong><span>問題</span></div>
          <div><strong id="infoPass">0%</strong><span>合格基準</span></div>
          <div><strong>∞</strong><span>再挑戦可能</span></div>
        </div>
      </div>

      <div class="form-card">
        <label>社員番号
          <input id="employeeId" type="text" inputmode="numeric" autocomplete="off" placeholder="例：123456" />
        </label>
        <label>名前
          <input id="employeeName" type="text" autocomplete="name" placeholder="例：豊田 太郎" />
        </label>
        <label class="check-row">
          <input id="shuffleToggle" type="checkbox" checked />
          <span>問題をランダムにする</span>
        </label>
        <p id="formError" class="form-error hidden" role="alert"></p>
        <button id="startBtn" class="primary-btn">テストを開始</button>
        <button id="historyBtn" class="secondary-btn">受験履歴を見る</button>
      </div>

      <div class="form-card" style="margin-top:14px">
        <p class="eyebrow" style="color:var(--muted)">設問データ</p>
        <p id="sourceLabel" class="source-label">内蔵データ（0問）</p>
        <input id="csvInput" type="file" accept=".csv,text/csv" class="hidden" />
        <button id="loadCsvBtn" class="small-btn" style="width:100%;padding:13px">CSVから設問を読み込む</button>
        <button id="resetCsvBtn" class="text-btn hidden">内蔵データに戻す</button>
        <p id="csvMessage" class="csv-message hidden" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="quizScreen" class="screen">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="progressText">1 / 1</span>
          <span id="scoreLive">正解 0</span>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </div>

      <article class="question-card">
        <div class="step-badge" id="stepBadge">手順①</div>
        <p class="question-no" id="questionNo">第1問</p>
        <h2 id="questionText"></h2>
        <p class="context" id="questionContext"></p>
        <div id="choices" class="choices"></div>
        <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>
        <button id="nextBtn" class="primary-btn hidden">次の問題へ</button>
      </article>
    </section>

    <section id="resultScreen" class="screen">
      <div id="resultCard" class="result-card">
        <p class="eyebrow">テスト結果</p>
        <div id="resultMark" class="result-mark">合格</div>
        <div class="score-circle"><strong id="resultScore">0</strong><span>点</span></div>
        <h2 id="resultMessage"></h2>
        <p id="resultDetail"></p>
      </div>
      <div id="reviewList" class="review-list"></div>
      <button id="copyResultBtn" class="small-btn" style="width:100%;padding:13px;margin-bottom:11px">結果をコピー（報告用）</button>
      <button id="retryWrongBtn" class="primary-btn hidden">間違えた問題だけ復習</button>
      <button id="retryBtn" class="secondary-btn">もう一度テスト</button>
      <button id="backTopBtn" class="text-btn">トップへ戻る</button>
    </section>

    <section id="historyScreen" class="screen">
      <div class="section-heading">
        <div>
          <p class="eyebrow">端末内保存</p>
          <h2>受験履歴</h2>
        </div>
        <button id="exportBtn" class="small-btn">CSV出力</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <button id="clearHistoryBtn" class="danger-text">履歴を全て削除</button>
      <button id="historyBackBtn" class="secondary-btn">戻る</button>
    </section>
  </main>

  <footer>データはこの端末内にのみ保存されます。集計は「CSV出力」で行ってください。</footer>

<script>
/* ===== 設定 ===== */
const PASS_LINE = 80;          // 合格基準（%）
const HISTORY_KEY = 'htTestHistory';
const QUESTIONS_KEY = 'htQuestionSet';
const HISTORY_MAX = 500;

/* ===== 設問 =====
   ・対になっていた設問（手順⑧／⑪／⑫）は、設問文が互いの答えを漏らすため統合
   ・「2秒／箇所」の重複設問を1問に集約                                   */
const BUILTIN_QUESTIONS = [
 {step:'①',q:'進度管理板から何を取り、どこに付けますか？',context:'（　　　　）に付け、生産管理板に開始時間を記入する。',a:'進度管理板から回数札を取り、おかもち',opts:['進度管理板から回数札を取り、おかもち','平準化ポストから納入かんばんを取り、荷台','ストアから工程かんばんを取り、腰ポケット','空箱置場から回数札を取り、製品']},
 {step:'②',q:'平準化ポストから1間口分の何を抜き取りますか？',context:'抜き取ったものは、おかもちポストへ投入します。',a:'納入かんばん',opts:['納入かんばん','工程かんばん','回数札','確認票']},
 {step:'③',q:'納入かんばんの「箱種コード」を確認する場所はどこですか？',context:'確認後、空箱に納入かんばんを差し、運搬具に積みます。',a:'空箱置場',opts:['空箱置場','平準化ポスト','製品ストア','照合台']},
 {step:'④',q:'集荷順路マップに沿って、どこへ行きますか？',context:'ライン№の間違いに注意します。',a:'組立ライン',opts:['組立ライン','集荷場','出荷場','平準化ポスト']},
 {step:'⑤',q:'該当ラインで、納入かんばんはどこから取りますか？',context:'取ったかんばんは腰ポケットに入れます。抜き忘れに注意。',a:'空箱',opts:['空箱','おかもち','平準化ポスト','製品ストア']},
 {step:'⑥',q:'空箱はどこへ投入しますか？',context:'かんばん枚数分・高さ基準・箱種に注意します。',a:'ラインシュート',opts:['ラインシュート','空箱置場','共通レーン','おかもちポスト']},
 {step:'⑦',q:'共通レーンから流れてきた製品を、どこに投入しますか？',context:'永久略番を確認して投入します。',a:'ストア',opts:['ストア','空箱置場','おかもち','ラインシュート']},
 {step:'⑧',q:'集荷を始めるとき、最初に行う動作はどれですか？',context:'（　　　　）から（　　　　）を1枚抜き、ラインNo.とストアNo.を確認する。',a:'腰ポケットから納入かんばんを1枚抜く',opts:['腰ポケットから納入かんばんを1枚抜く','おかもちから工程かんばんを1枚抜く','製品の上から確認票を1枚抜く','平準化ポストから回数札を1枚抜く']},
 {step:'⑨',q:'どこから製品を取り出し、荷台に置きますか？',context:'指定のストアから集荷します。',a:'ストア',opts:['ストア','空箱置場','共通レーン','ラインシュート']},
 {step:'⑩',q:'製品に付いている何を抜き取りますか？',context:'かんばんの落下がないかも確認します。',a:'工程かんばん',opts:['工程かんばん','納入かんばん','回数札','確認票']},
 {step:'⑪',q:'工程かんばんの裏にある何とポイント部位を近づけますか？',context:'10cm以内に近づけて照合します。',a:'確認票',opts:['確認票','納入かんばん','回数札','箱種ラベル']},
 {step:'⑪',q:'ポイントを確認する順番はどれですか？',context:'（　　　　）⇒（　　　　）の順で確認します。',a:'確認票 ⇒ 製品',opts:['確認票 ⇒ 製品','製品 ⇒ 確認票','工程かんばん ⇒ 確認票','納入かんばん ⇒ 製品']},
 {step:'⑪',q:'ポイントの突合せに使う確認動作はどれですか？',context:'ポイントを（　　　　）で突合せます。',a:'指差し・声出し',opts:['指差し・声出し','目視のみ','黙読のみ','写真撮影']},
 {step:'⑪',q:'ポイント1箇所あたり何秒で見比べますか？',context:'確認票写真と製品の向きを合わせ、体の正面で持って確認します。',a:'2秒',opts:['2秒','0.5秒','5秒','10秒']},
 {step:'⑪',q:'照合はどの高さの範囲で確認しますか？',context:'ゴールデンゾーンで確認します。',a:'58.6cm～141.2cm',opts:['58.6cm～141.2cm','20cm～80cm','100cm～180cm','高さの決まりはない']},
 {step:'⑫',q:'2枚のかんばんはどのように重ねますか？',context:'（　　　　）の向きで重ねます。',a:'納入かんばんを下・工程かんばんを上',opts:['納入かんばんを下・工程かんばんを上','納入かんばんを上・工程かんばんを下','2枚を左右に並べる','工程かんばんを裏返して重ねる']},
 {step:'⑫',q:'かんばんのQRコードが隠れないよう、どちらの手で左端を持ちますか？',context:'スキャナーエラーを防ぐための持ち方です。',a:'左手',opts:['左手','右手','両手で中央','どちらでもよい']},
 {step:'⑬',q:'納入かんばんと工程かんばんの何を確認しますか？',context:'2枚の同じ項目を突合せます。',a:'略番',opts:['略番','発行日','箱数だけ','担当者名']},
 {step:'⑬',q:'⑬の急所として、確認はどのように行いますか？',context:'見間違いを防ぐための確認動作です。',a:'略番に指を差す',opts:['略番に指を差す','目視だけで確認する','箱数だけを確認する','2枚を重ねたまま確認しない']},
 {step:'①',q:'遅れが発生したとき、何分以上でリリーフを要請しますか？',context:'遅れの発生は未納・トラック待機につながります。',a:'2分以上',opts:['2分以上','1分以上','5分以上','10分以上']}
];
let QUESTIONS = BUILTIN_QUESTIONS;

/* ===== 共通 ===== */
const $ = id => document.getElementById(id);
const screens = ['startScreen','quizScreen','resultScreen','historyScreen'];
let sourceName = '内蔵データ';
let quiz = [], index = 0, correct = 0, answers = [], locked = false, isRetry = false, current = 'startScreen';

function show(id){
  current = id;
  screens.forEach(s => $(s).classList.toggle('active', s === id));
  $('homeBtn').classList.toggle('hidden', id === 'startScreen');
  window.scrollTo({top:0, behavior:'smooth'});
}
function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function clean(v){ return (v || '').trim(); }
function esc(s){ return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function loadHistory(){
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch { return []; }
}

/* ===== 開始画面 ===== */
function refreshMeta(){
  $('heroLead').textContent = `全${QUESTIONS.length}問の四択テストです。問題順・選択肢は毎回ランダムに変わります。`;
  $('infoTotal').textContent = QUESTIONS.length;
  $('infoPass').textContent = `${PASS_LINE}%`;
  $('sourceLabel').textContent = `${sourceName}（${QUESTIONS.length}問）`;
  $('resetCsvBtn').classList.toggle('hidden', sourceName === '内蔵データ');
}

function showError(msg, focusId){
  const el = $('formError');
  el.textContent = msg;
  el.classList.remove('hidden');
  if(focusId) $(focusId).focus();
}
$('startBtn').addEventListener('click', () => {
  const emp = clean($('employeeId').value), name = clean($('employeeName').value);
  if(!/^\d{1,10}$/.test(emp)){ showError('社員番号を半角数字で入力してください。', 'employeeId'); return; }
  if(!name){ showError('名前を入力してください。', 'employeeName'); return; }
  $('formError').classList.add('hidden');
  startQuiz(QUESTIONS, $('shuffleToggle').checked, false);
});

/* ===== 出題 ===== */
function startQuiz(source, doShuffle, retry){
  quiz = doShuffle ? shuffle(source) : [...source];
  index = 0; correct = 0; answers = []; locked = false; isRetry = retry;
  show('quizScreen');
  renderQuestion();
}
function renderQuestion(){
  locked = false;
  const item = quiz[index];
  $('progressText').textContent = `${index + 1} / ${quiz.length}`;
  $('scoreLive').textContent = `正解 ${correct}`;
  $('progressBar').style.width = `${(index / quiz.length) * 100}%`;
  $('stepBadge').textContent = `手順${item.step}`;
  $('questionNo').textContent = `第${index + 1}問`;
  $('questionText').textContent = item.q;
  $('questionContext').textContent = item.context;
  $('feedback').className = 'feedback hidden';
  $('feedback').textContent = '';
  $('nextBtn').classList.add('hidden');

  const box = $('choices');
  box.innerHTML = '';
  shuffle(item.opts).forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.type = 'button';
    b.dataset.value = opt;
    const letter = document.createElement('span');
    letter.className = 'choice-letter';
    letter.textContent = String.fromCharCode(65 + i);
    const text = document.createElement('span');
    text.textContent = opt;
    b.append(letter, text);
    b.addEventListener('click', () => answer(opt, b));
    box.appendChild(b);
  });
}
function answer(selected, button){
  if(locked) return;
  locked = true;
  const item = quiz[index], ok = selected === item.a;
  if(ok) correct++;
  answers.push({item, selected, ok});

  document.querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    if(b.dataset.value === item.a) b.classList.add('correct');
    else if(b === button) b.classList.add('wrong');
  });

  const fb = $('feedback');
  fb.className = `feedback ${ok ? 'ok' : 'ng'}`;
  fb.textContent = ok ? '正解！' : `不正解。正解は「${item.a}」です。`;
  $('scoreLive').textContent = `正解 ${correct}`;
  $('progressBar').style.width = `${((index + 1) / quiz.length) * 100}%`;
  $('nextBtn').textContent = index === quiz.length - 1 ? '結果を見る' : '次の問題へ';
  $('nextBtn').classList.remove('hidden');
}
$('nextBtn').addEventListener('click', () => {
  index++;
  if(index < quiz.length) renderQuestion();
  else finishQuiz();
});

/* ===== 結果 ===== */
function finishQuiz(){
  const pct = Math.round(correct / quiz.length * 100), pass = pct >= PASS_LINE;
  show('resultScreen');
  $('resultScore').textContent = pct;
  $('resultMark').textContent = pass ? '合格' : '再確認';
  $('resultMark').className = `result-mark ${pass ? 'pass' : 'fail'}`;
  $('resultMessage').textContent = pass ? 'おめでとうございます！' : '間違えた手順を復習しましょう';
  $('resultDetail').textContent = `${quiz.length}問中 ${correct}問正解（合格基準${PASS_LINE}点）${isRetry ? '／復習モード' : ''}`;

  const wrong = answers.filter(x => !x.ok);
  $('reviewList').innerHTML = wrong.length
    ? '<h2>間違えた問題</h2>' + wrong.map((x, i) =>
        `<div class="review-item"><h3>${i + 1}. 手順${esc(x.item.step)} ${esc(x.item.q)}</h3>` +
        `<p>あなたの回答：${esc(x.selected)}</p>` +
        `<p class="answer">正解：${esc(x.item.a)}</p></div>`).join('')
    : '<div class="review-item"><h3>全問正解です！</h3><p>作業手順を正しく理解できています。</p></div>';

  $('retryWrongBtn').classList.toggle('hidden', wrong.length === 0);
  $('retryWrongBtn').onclick = () => startQuiz(wrong.map(x => x.item), true, true);

  const report = `【HT理解度テスト結果】\n${new Date().toLocaleString('ja-JP')}\n社員番号：${clean($('employeeId').value)}\n氏名：${clean($('employeeName').value)}\n点数：${pct}点（${correct}/${quiz.length}問）\n判定：${pass ? '合格' : '再確認'}${isRetry ? '\n区分：復習' : ''}`;
  $('copyResultBtn').onclick = async () => {
    try {
      await navigator.clipboard.writeText(report);
      $('copyResultBtn').textContent = 'コピーしました';
      setTimeout(() => { $('copyResultBtn').textContent = '結果をコピー（報告用）'; }, 2000);
    } catch {
      prompt('この文面をコピーして報告してください。', report);
    }
  };

  saveHistory(pct, correct, quiz.length, pass);
}
function saveHistory(score, c, total, pass){
  const list = loadHistory();
  list.unshift({
    date: new Date().toLocaleString('ja-JP'),
    employeeId: clean($('employeeId').value),
    name: clean($('employeeName').value),
    score, correct: c, total, pass, retry: isRetry
  });
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, HISTORY_MAX))); }
  catch { alert('履歴を保存できませんでした。CSV出力後、履歴を削除してください。'); }
}

/* ===== 履歴 ===== */
function renderHistory(){
  const list = loadHistory();
  $('historyList').innerHTML = list.length
    ? list.map(x =>
        `<div class="history-row">` +
        `<strong>${esc(x.name)}（${esc(x.employeeId || '—')}）${x.pass ? '✓' : ''}</strong>` +
        `<span>${esc(x.date)}・${x.correct}/${x.total}問${x.retry ? '（復習）' : ''}</span>` +
        `<div class="history-score">${x.score}点</div></div>`).join('')
    : '<div class="empty">受験履歴はありません。テストを受けると、ここに結果が並びます。</div>';
}
$('exportBtn').onclick = () => {
  const list = loadHistory();
  if(!list.length){ alert('出力する履歴がありません。'); return; }
  const rows = [
    ['受験日時','社員番号','名前','点数','正解数','問題数','判定','区分'],
    ...list.map(x => [x.date, x.employeeId, x.name, x.score, x.correct, x.total, x.pass ? '合格' : '再確認', x.retry ? '復習' : '本テスト'])
  ];
  const csv = '\ufeff' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `HT理解度テスト履歴_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$('clearHistoryBtn').onclick = () => {
  if(confirm('受験履歴を全て削除しますか？この操作は取り消せません。')){
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  }
};

/* ===== 画面遷移 ===== */
$('retryBtn').onclick = () => startQuiz(QUESTIONS, $('shuffleToggle').checked, false);
$('backTopBtn').onclick = () => show('startScreen');
$('historyBtn').onclick = () => { renderHistory(); show('historyScreen'); };
$('historyBackBtn').onclick = () => show('startScreen');
$('homeBtn').onclick = () => {
  if(current === 'quizScreen' && !confirm('テストを終了してトップへ戻りますか？回答は記録されません。')) return;
  show('startScreen');
};

/* ===== 設問データの読み込み ===== */
/* 列は「手順／設問／補足文／正解／誤答1／誤答2／誤答3」。見出し行を自動判別します。 */
function parseCSV(text){
  text = text.replace(/^\ufeff/, '');
  const rows = []; let row = [], field = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += c;
    } else if(c === '"') q = true;
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if(c !== '\r') field += c;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => clean(v) !== ''));
}
function rowsToQuestions(rows){
  const hi = rows.findIndex(r => r.some(v => clean(v) === '設問') && r.some(v => clean(v) === '正解'));
  if(hi < 0) throw new Error('見出し行が見つかりません。1行目に「手順・設問・補足文・正解・誤答1〜3」を含む行が必要です。');
  const head = rows[hi].map(v => clean(v).replace(/（.*?）/g, ''));
  const col = n => head.findIndex(h => h === n);
  const iStep = col('手順'), iQ = col('設問'), iCtx = col('補足文'), iA = col('正解');
  const iW = ['誤答1','誤答2','誤答3'].map(col);
  if(iQ < 0 || iA < 0 || iW.some(i => i < 0)) throw new Error('「設問」「正解」「誤答1〜3」の列が揃っていません。');

  const list = [], errors = [];
  rows.slice(hi + 1).forEach((r, n) => {
    const get = i => i >= 0 ? clean(r[i]) : '';
    const q = get(iQ), a = get(iA), opts = [a, ...iW.map(get)];
    if(!q && !a) return;                                   // 空行・注記行は無視
    const line = `${n + 1}行目`;
    if(!q || !a || opts.some(o => !o)){ errors.push(`${line}：設問・正解・誤答1〜3のいずれかが空欄です。`); return; }
    if(new Set(opts).size !== 4){ errors.push(`${line}：選択肢が重複しています。`); return; }
    list.push({step: get(iStep) || '－', q, context: get(iCtx), a, opts});
  });
  if(!list.length) throw new Error('取り込める設問が1問もありません。' + (errors[0] ? '\n' + errors[0] : ''));
  return {list, errors};
}
function decodeCSV(buffer){
  const utf8 = new TextDecoder('utf-8').decode(buffer);
  if(!utf8.includes('\ufffd')) return utf8;
  try { return new TextDecoder('shift_jis').decode(buffer); } catch { return utf8; }
}
function applyQuestions(list, name){
  QUESTIONS = list; sourceName = name; refreshMeta();
}
function csvMsg(text, kind){
  const el = $('csvMessage');
  el.textContent = text;
  el.className = `csv-message ${kind || ''}`;
  el.classList.remove('hidden');
}

$('loadCsvBtn').onclick = () => $('csvInput').click();
$('csvInput').onchange = async e => {
  const file = e.target.files[0];
  if(!file) return;
  try {
    const {list, errors} = rowsToQuestions(parseCSV(decodeCSV(await file.arrayBuffer())));
    localStorage.setItem(QUESTIONS_KEY, JSON.stringify({name: file.name, list}));
    applyQuestions(list, file.name);
    csvMsg(`${list.length}問を読み込みました。` + (errors.length ? `\n次の行は取り込めませんでした：\n・${errors.join('\n・')}` : ''), errors.length ? '' : 'ok');
  } catch(err){
    csvMsg(`読み込めませんでした。\n${err.message}`, 'ng');
  }
  e.target.value = '';
};
$('resetCsvBtn').onclick = () => {
  localStorage.removeItem(QUESTIONS_KEY);
  applyQuestions(BUILTIN_QUESTIONS, '内蔵データ');
  csvMsg('内蔵データに戻しました。', 'ok');
};

/* 起動時：保存済みCSV → 同じフォルダの questions.csv → 内蔵データ の順で採用 */
(async function initQuestions(){
  try {
    const saved = JSON.parse(localStorage.getItem(QUESTIONS_KEY) || 'null');
    if(saved && Array.isArray(saved.list) && saved.list.length){
      applyQuestions(saved.list, saved.name || '読み込み済みCSV');
      return;
    }
  } catch {}
  try {
    const res = await fetch('questions.csv', {cache: 'no-store'});
    if(res.ok){
      const {list} = rowsToQuestions(parseCSV(decodeCSV(await res.arrayBuffer())));
      applyQuestions(list, 'questions.csv');
      return;
    }
  } catch {}
  refreshMeta();
})();

</script>
